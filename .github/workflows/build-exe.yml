name: Windows EXE

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bagimliliklar
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Testler
        run: python -m unittest discover -s tests -v

      - name: EXE olustur
        working-directory: src
        run: pyinstaller --onefile --windowed --name DIA_Veri_Temizleme gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: DIA_Veri_Temizleme
          path: src/dist/DIA_Veri_Temizleme.exe

      - name: Indirme linkini guncelle (son-surum)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum src/dist/DIA_Veri_Temizleme.exe \
            --target "${{ github.sha }}" \
            --title "DIA Veri Temizleme - son surum" \
            --notes "Kurulum gerekmez: DIA_Veri_Temizleme.exe dosyasini indirip cift tiklayin. Commit: ${{ github.sha }}"
