name: Windows EXE

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bagimliliklar
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Testler
        run: python -m unittest discover -s tests -v

      - name: EXE olustur
        working-directory: src
        run: |
          pyinstaller --onefile --windowed --name DIA_Veri_Temizleme gui.py
          pyinstaller --onefile --windowed --name RACA_Teklif teklif_main.py

      - name: Teklif EXE oz testi (PDF uretiyor mu)
        working-directory: src
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RACA_Teklif.exe -ArgumentList '--oz-test', "$PWD\oz_test.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path oz_test.pdf) -or -not (Test-Path oz_test.pdf.xlsx)) { throw "RACA_Teklif.exe oz testi basarisiz (cikis kodu $($p.ExitCode))" }
          Write-Host "PDF boyutu: $((Get-Item oz_test.pdf).Length) bayt"

      - uses: actions/upload-artifact@v4
        with:
          name: DIA_Veri_Temizleme
          path: |
            src/dist/DIA_Veri_Temizleme.exe
            src/dist/RACA_Teklif.exe

      - name: Indirme linkini guncelle (son-surum)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # Yarim kalmis taslak yayinlar (indirme linki 404 verir) temizlenir
          gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft) | .id' | while read -r id; do
            gh api -X DELETE "repos/$REPO/releases/$id" || true
          done
          gh release delete son-surum --yes --cleanup-tag || true
          sleep 5
          gh release create son-surum --target "${{ github.sha }}" \
            --title "DIA Veri Temizleme - son surum" \
            --notes "Kurulum gerekmez: indirip cift tiklayin. DIA_Veri_Temizleme.exe (veri temizleme + teklif), RACA_Teklif.exe (sadece teklif motoru). Commit: ${{ github.sha }}"
          gh release upload son-surum src/dist/DIA_Veri_Temizleme.exe src/dist/RACA_Teklif.exe --clobber
          gh release edit son-surum --draft=false
          # Linkler gercekten indiriliyor mu
          for f in DIA_Veri_Temizleme.exe RACA_Teklif.exe; do
            kod=$(curl -sL -o /dev/null -w "%{http_code}" -r 0-0 "https://github.com/$REPO/releases/download/son-surum/$f")
            echo "$f -> $kod"
            if [ "$kod" != "200" ] && [ "$kod" != "206" ]; then echo "Indirme linki calismiyor: $f"; exit 1; fi
          done
